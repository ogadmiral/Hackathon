<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome</title>
</head>
<body>
  <h1 id="welcome"></h1>

  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get("user");

    if (username) {
      document.getElementById("welcome").innerText = `Welcome, ${username}! 🎉`;
    } else {
      document.getElementById("welcome").innerText = "Welcome!";
    }
  </script>
</body>
</html>
